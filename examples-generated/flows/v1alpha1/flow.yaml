apiVersion: flows.authentik.crossplane.io/v1alpha1
kind: Flow
metadata:
  annotations:
    meta.upbound.io/example-id: flows/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: flow
  name: flow
spec:
  forProvider:
    designation: authorization
    name: test-flow
    slug: test-flow
    title: Test flow

---

apiVersion: flows.authentik.crossplane.io/v1alpha1
kind: FlowStageBinding
metadata:
  annotations:
    meta.upbound.io/example-id: flows/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: dummy-flow
  name: dummy-flow
spec:
  forProvider:
    order: 0
    stage: ${authentik_stage_dummy.name.id}
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: flow

---

apiVersion: stages.authentik.crossplane.io/v1alpha1
kind: Dummy
metadata:
  annotations:
    meta.upbound.io/example-id: flows/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: test-stage
