apiVersion: applications.unbounded-tech.com/v1alpha1
kind: ProviderRadius
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/providerradius
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    authorizationFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    clientNetworks: 10.10.0.0/24
    name: radius-app
    sharedSecretSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system

---

apiVersion: applications.unbounded-tech.com/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/providerradius
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: radius-app
    protocolProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    slug: radius-app
