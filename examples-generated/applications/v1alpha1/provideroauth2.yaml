apiVersion: applications.unbounded-tech.com/v1alpha1
kind: ProviderOauth2
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/provideroauth2
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    allowedRedirectUris:
    - matching_mode: strict
      url: http://localhost
    clientId: grafana
    name: grafana

---

apiVersion: applications.unbounded-tech.com/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: applications/v1alpha1/provideroauth2
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: test app
    protocolProviderSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    slug: test-app
