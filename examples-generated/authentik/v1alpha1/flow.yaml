apiVersion: authentik.unbounded-tech.com/v1alpha1
kind: Flow
metadata:
  annotations:
    meta.upbound.io/example-id: authentik/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: flow
  name: flow
spec:
  forProvider:
    designation: authorization
    name: test-flow
    slug: test-flow
    title: Test flow

---

apiVersion: flow.unbounded-tech.com/v1alpha1
kind: StageBinding
metadata:
  annotations:
    meta.upbound.io/example-id: authentik/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: dummy-flow
  name: dummy-flow
spec:
  forProvider:
    order: 0
    stage: ${authentik_stage_dummy.name.id}
    target: ${authentik_flow.flow.uuid}

---

apiVersion: stage.unbounded-tech.com/v1alpha1
kind: Dummy
metadata:
  annotations:
    meta.upbound.io/example-id: authentik/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: test-stage
