apiVersion: customization.unbounded-tech.com/v1alpha1
kind: PolicyBinding
metadata:
  annotations:
    meta.upbound.io/example-id: customization/v1alpha1/policybinding
  labels:
    testing.upbound.io/example-name: app-access
  name: app-access
spec:
  forProvider:
    order: 0
    policy: ${authentik_policy_expression.policy.id}
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: name

---

apiVersion: applications.unbounded-tech.com/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: customization/v1alpha1/policybinding
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: test app
    slug: test-app

---

apiVersion: customization.unbounded-tech.com/v1alpha1
kind: PolicyExpression
metadata:
  annotations:
    meta.upbound.io/example-id: customization/v1alpha1/policybinding
  labels:
    testing.upbound.io/example-name: policy
  name: policy
spec:
  forProvider:
    expression: return True
    name: example
